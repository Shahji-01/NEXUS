# ============================================================================
# NEXUS — Render Blueprint (backend API + PostgreSQL)
#
# Deploys the Express API (REST + WebSocket) and a free PostgreSQL database.
# The React dashboard is deployed separately on Vercel (see CLOUD_DEPLOY.md).
#
# The Python CV detector is NOT included: PyTorch/YOLO exceed Render's free
# 512 MB tier. With no detector reachable, the app runs in SIMULATION mode and
# video mode gracefully falls back (by design). To enable video detection,
# deploy the detector on a paid instance and set DETECTOR_URL (see the commented
# service at the bottom).
# ============================================================================

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus

services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    # Build the API bundle and push the Drizzle schema to the database.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api run build && pnpm --filter @workspace/db run push
    startCommand: node --enable-source-maps apps/api/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24.13.1"
      # Render injects PORT automatically; the API reads it.
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      # Detector is not deployed on the free tier — leave empty so video mode
      # falls back to the simulation. Set to your detector URL to enable it.
      - key: DETECTOR_URL
        value: ""
      # Optional: enables the AI Copilot (Google Gemini). Set in the dashboard.
      - key: GEMINI_API_KEY
        sync: false

# ----------------------------------------------------------------------------
